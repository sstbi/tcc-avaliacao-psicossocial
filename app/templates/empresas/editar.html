{% extends "base.html" %}

{% block title %}Editar Empresa{% endblock %}

{% block content %}
<h2>Editar Empresa</h2>

<form method="post" class="mt-3">
    <div class="mb-3">
        <label class="form-label">Razão Social</label>
        <input type="text" name="razao_social" class="form-control" value="{{ empresa.razao_social }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Nome Fantasia</label>
        <input type="text" name="nome_fantasia" class="form-control" value="{{ empresa.nome_fantasia }}">
    </div>

    <div class="mb-3">
        <label class="form-label">CNPJ</label>
        <input type="text" name="cnpj" class="form-control" value="{{ empresa.cnpj }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control" value="{{ empresa.email }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="text" name="telefone" class="form-control" value="{{ empresa.telefone }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Responsável</label>
        <input type="text" name="responsavel" class="form-control" value="{{ empresa.responsavel }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
            <option value="Ativa" {% if empresa.status == 'Ativa' %}selected{% endif %}>Ativa</option>
            <option value="Inativa" {% if empresa.status == 'Inativa' %}selected{% endif %}>Inativa</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Atualizar</button>
    <a href="{{ url_for('main.listar_empresas') }}" class="btn btn-secondary">Voltar</a>
</form>
{% endblock %}
