{% extends "base.html" %}

{% block title %}Editar Unidade{% endblock %}

{% block content %}
<h2>Editar Unidade</h2>

<form method="post" class="mt-3">
    <div class="mb-3">
        <label class="form-label">Empresa</label>
        <select name="empresa_id" class="form-select" required>
            {% for empresa in empresas %}
            <option value="{{ empresa.id }}" {% if empresa.id == unidade.empresa_id %}selected{% endif %}>
                {{ empresa.razao_social }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Nome da Unidade</label>
        <input type="text" name="nome" class="form-control" value="{{ unidade.nome }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Descrição</label>
        <input type="text" name="descricao" class="form-control" value="{{ unidade.descricao or '' }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
            <option value="Ativa" {% if unidade.status == 'Ativa' %}selected{% endif %}>Ativa</option>
            <option value="Inativa" {% if unidade.status == 'Inativa' %}selected{% endif %}>Inativa</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Atualizar</button>
    <a href="{{ url_for('main.listar_unidades') }}" class="btn btn-secondary">Voltar</a>
</form>
{% endblock %}
