{% extends "base.html" %}

{% block title %}Editar Pergunta{% endblock %}

{% block content %}
<h2>Editar Pergunta</h2>

<form method="post" class="mt-3">

    <div class="mb-3">
        <label class="form-label">Questionário</label>
        <select name="questionario_id" class="form-select" required>
            {% for questionario in questionarios %}
            <option value="{{ questionario.id }}" {% if questionario.id == pergunta.questionario_id %}selected{% endif %}>
                {{ questionario.nome }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Ordem</label>
        <input type="number" name="ordem" class="form-control" value="{{ pergunta.ordem }}" min="1" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Texto da Pergunta</label>
        <textarea name="texto" class="form-control" rows="4" required>{{ pergunta.texto }}</textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Tipo de Resposta</label>
        <select name="tipo_resposta" class="form-select" required>
            <option value="escala_1_5" {% if pergunta.tipo_resposta == 'escala_1_5' %}selected{% endif %}>
                Escala de 1 a 5
            </option>
            <option value="sim_nao" {% if pergunta.tipo_resposta == 'sim_nao' %}selected{% endif %}>
                Sim / Não
            </option>
            <option value="texto" {% if pergunta.tipo_resposta == 'texto' %}selected{% endif %}>
                Texto livre
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Obrigatória?</label>
        <select name="obrigatoria" class="form-select" required>
            <option value="sim" {% if pergunta.obrigatoria %}selected{% endif %}>Sim</option>
            <option value="nao" {% if not pergunta.obrigatoria %}selected{% endif %}>Não</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
            <option value="Ativa" {% if pergunta.status == 'Ativa' %}selected{% endif %}>Ativa</option>
            <option value="Inativa" {% if pergunta.status == 'Inativa' %}selected{% endif %}>Inativa</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">
        Atualizar
    </button>

    <a href="{{ url_for('main.listar_perguntas') }}" class="btn btn-secondary">
        Voltar
    </a>

</form>
{% endblock %}
