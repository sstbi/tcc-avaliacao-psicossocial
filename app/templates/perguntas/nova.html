{% extends "base.html" %}

{% block title %}Nova Pergunta{% endblock %}

{% block content %}
<h2>Cadastro de Pergunta</h2>

<form method="post" class="mt-3">

    <div class="mb-3">
        <label class="form-label">Questionário</label>
        <select name="questionario_id" class="form-select" required>
            <option value="">Selecione...</option>
            {% for questionario in questionarios %}
            <option value="{{ questionario.id }}">
                {{ questionario.nome }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Ordem</label>
        <input type="number" name="ordem" class="form-control" value="1" min="1" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Texto da Pergunta</label>
        <textarea name="texto" class="form-control" rows="4" required></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Tipo de Resposta</label>
        <select name="tipo_resposta" class="form-select" required>
            <option value="escala_1_5">Escala de 1 a 5</option>
            <option value="sim_nao">Sim / Não</option>
            <option value="texto">Texto livre</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Obrigatória?</label>
        <select name="obrigatoria" class="form-select" required>
            <option value="sim">Sim</option>
            <option value="nao">Não</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
            <option value="Ativa">Ativa</option>
            <option value="Inativa">Inativa</option>
        </select>
    </div>

    <button type="submit" class="btn btn-success">
        Salvar
    </button>

    <a href="{{ url_for('main.listar_perguntas') }}" class="btn btn-secondary">
        Voltar
    </a>

</form>
{% endblock %}
