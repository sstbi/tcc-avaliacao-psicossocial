{% extends "base.html" %}

{% block title %}Nova Aplicação{% endblock %}

{% block content %}
<h2>Nova Aplicação</h2>

<form method="post" class="mt-3">

    <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" name="titulo" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Questionário</label>
        <select name="questionario_id" class="form-select" required>
            <option value="">Selecione...</option>

            {% for questionario in questionarios %}
            <option value="{{ questionario.id }}">
                {{ questionario.nome }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Empresa</label>
        <select name="empresa_id" class="form-select" required>
            <option value="">Selecione...</option>

            {% for empresa in empresas %}
            <option value="{{ empresa.id }}">
                {{ empresa.razao_social }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Unidade</label>
        <select name="unidade_id" class="form-select">
            <option value="">Sem unidade</option>

            {% for unidade in unidades %}
            <option value="{{ unidade.id }}">
                {{ unidade.nome }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Setor</label>
        <select name="setor_id" class="form-select">
            <option value="">Sem setor</option>

            {% for setor in setores %}
            <option value="{{ setor.id }}">
                {{ setor.nome }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Cargo</label>
        <select name="cargo_id" class="form-select">
            <option value="">Sem cargo</option>

            {% for cargo in cargos %}
            <option value="{{ cargo.id }}">
                {{ cargo.nome }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Data Início</label>
        <input type="date" name="data_inicio" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Data Fim</label>
        <input type="date" name="data_fim" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
            <option value="Aberta">Aberta</option>
            <option value="Encerrada">Encerrada</option>
        </select>
    </div>

    <button type="submit" class="btn btn-success">
        Salvar
    </button>

    <a href="{{ url_for('main.listar_aplicacoes') }}"
       class="btn btn-secondary">
        Voltar
    </a>

</form>
{% endblock %}
