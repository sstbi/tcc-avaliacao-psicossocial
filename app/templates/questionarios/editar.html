{% extends "base.html" %}

{% block title %}Editar Questionário{% endblock %}

{% block content %}
<h2>Editar Questionário</h2>

<form method="post" class="mt-3">

    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input
            type="text"
            name="nome"
            class="form-control"
            value="{{ questionario.nome }}"
            required
        >
    </div>

    <div class="mb-3">
        <label class="form-label">Descrição</label>
        <input
            type="text"
            name="descricao"
            class="form-control"
            value="{{ questionario.descricao or '' }}"
        >
    </div>

    <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
            <option value="Ativo" {% if questionario.status == 'Ativo' %}selected{% endif %}>
                Ativo
            </option>
            <option value="Inativo" {% if questionario.status == 'Inativo' %}selected{% endif %}>
                Inativo
            </option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">
        Atualizar
    </button>

    <a href="{{ url_for('main.listar_questionarios') }}" class="btn btn-secondary">
        Voltar
    </a>

</form>
{% endblock %}
